<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- 🔹 HERO SECTION -->
<section class="hero">
    <div class="hero-content">

        <div class="text fade-in">
            <h1>🎓 Student Performance Analysis</h1>
            <p>Understand student progress using Machine Learning</p>
            <button onclick="scrollToPredict()">Get Started ↓</button>
        </div>

        <div class="image float">
        <img src="https://i.pinimg.com/736x/1e/01/72/1e01722045d1ad929373614c4a7de7fb.jpg" alt="student">
       </div>

    </div>
</section>

{% if prediction_text is not none %}
    <a href="/" class="back-btn">← Back</a>
{% endif %}

<!-- 🔹 PREDICTION SECTION -->
<section class="predict-section" id="predict">

    <div class="card pop-in">
        <h2>📊 Predict Performance</h2>

        <form action="/predict#predict" method="post">

            <input type="number" name="study_hours" placeholder="Total Study Hours" required>
            <input type="number" name="attendance" placeholder="Attendance (%)" required>
            <input type="number" name="previous_marks" placeholder="Previous Marks" required>

            <button type="submit">Predict</button>
        </form>

        {% if prediction_text is not none %}
            <div class="result 
                {% if 'Pass' in prediction_text %}pass{% else %}fail{% endif %} slide-up">
                {{ prediction_text }}
            </div>
        {% endif %}
    </div>

</section>


<script>
function scrollToPredict() {
    document.getElementById("predict").scrollIntoView({ behavior: "smooth" });
}
</script>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
window.onload = function() {
    let text = "{{ prediction_text }}";

    if (text.includes("Pass")) {
        confetti({
            particleCount: 150,
            spread: 70,
            origin: { y: 0.6 }
        });
    }
};
</script>

<canvas id="confetti"></canvas>


</body>
</html>
